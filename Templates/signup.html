<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f3f4f6;
    padding:20px;
}
.card{
    width:100%;
    max-width:420px;
    background:white;
    padding:40px 30px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}
.card h1{
    text-align:center;
    margin-bottom:10px;
    color:#1f2937;
}
.card p{
    text-align:center;
    margin-bottom:30px;
    color:#6b7280;
}
.form-group{
    margin-bottom:18px;
}
label{
    display:block;
    margin-bottom:6px;
    font-weight:500;
    color:#374151;
}
input{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid #d1d5db;
    font-size:14px;
    outline:none;
    transition:0.3s;
}
input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}
.password-wrapper{
    position:relative;
}
.toggle{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:14px;
}
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#2563eb,#1d4ed8);
    color:white;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    margin-top:10px;
}
button:hover{
    opacity:0.9;
}
.footer{
    text-align:center;
    margin-top:20px;
    font-size:14px;
    color:#6b7280;
}
.footer a{
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}
@media(max-width:480px){
    .card{
        padding:30px 20px;
    }
}
</style>
</head>
<body>

<div class="card">
    <h1>Create Account</h1>
    <p>Join us today! Enter your details below</p>

    <form id="registerForm">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="John Doe">  <!-- no id, ignored -->
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="phone_number" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Create a strong password" required>
                <span class="toggle" onclick="togglePassword('password')">👁</span>
            </div>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                <span class="toggle" onclick="togglePassword('confirmPassword')">👁</span>
            </div>
        </div>

        <div id="errorMessage" style="color:red; text-align:center; margin-bottom:10px;"></div>
        <div id="successMessage" style="color:green; text-align:center; margin-bottom:10px;"></div>

        <button type="submit" id="submitBtn">Create Account</button>
    </form>

    <div class="footer">
        Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </div>
</div>

<script>
function togglePassword(id) {
    const field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}

document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const phone_number = document.getElementById('phone_number').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const btn = document.getElementById('submitBtn');

    errorMessage.textContent = '';
    successMessage.textContent = '';

    if (password !== confirmPassword) {
        errorMessage.textContent = 'Passwords do not match.';
        return;
    }

    btn.textContent = 'Creating account...';
    btn.disabled = true;

    try {
        const response = await fetch('/auth/register/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email, password, phone_number })
        });

        const data = await response.json();

        if (response.ok) {
            successMessage.textContent = data.message || 'Account created successfully!';
            setTimeout(() => {
                window.location.href = '/auth/login/';
            }, 2000);
        } else {
            errorMessage.textContent = data.email?.[0] || data.password?.[0] || data.error || 'Registration failed.';
        }

    } catch (error) {
        errorMessage.textContent = 'Something went wrong. Please try again.';
    } finally {
        btn.textContent = 'Create Account';
        btn.disabled = false;
    }
});
</script>

</body>
</html>
