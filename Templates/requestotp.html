
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f7fb;
    padding:20px;
}
.card{
    width:100%;
    max-width:400px;
    background:white;
    padding:40px 30px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}
h2{text-align:center;margin-bottom:10px;color:#1e3a8a;}
p{text-align:center;margin-bottom:25px;color:#555;}
input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
}
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}
button:hover{opacity:0.9;}
.error{color:red;text-align:center;margin-bottom:10px;}
.success{color:green;text-align:center;margin-bottom:10px;}
@media(max-width:480px){.card{padding:30px 20px;}}
</style>
</head>
<body>
<div class="card">
    <h2>Reset Password</h2>
    <p>Enter your email to receive an OTP</p>
    <form id="requestOtpForm">
        <input type="email" id="email" placeholder="Enter your email" required>
        <div id="errorMessage" class="error"></div>
        <div id="successMessage" class="success"></div>
        <button type="submit" id="submitBtn">Send OTP</button>
    </form>
</div>

<script>
document.getElementById('requestOtpForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const btn = document.getElementById('submitBtn');

    errorMessage.textContent = '';
    successMessage.textContent = '';
    btn.textContent = 'Sending OTP...';
    btn.disabled = true;

    try {
        const response = await fetch('/password-reset/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (response.ok) {
            successMessage.textContent = data.message || 'OTP sent to your email!';
            // redirect to verify OTP page with email as query param
            setTimeout(() => {
                window.location.href = `/reset-otp/?email=${encodeURIComponent(email)}`;
            }, 2000);
        } else {
            errorMessage.textContent = data.email?.[0] || data.error || 'Something went wrong.';
        }

    } catch (error) {
        errorMessage.textContent = 'Something went wrong. Please try again.';
    } finally {
        btn.textContent = 'Send OTP';
        btn.disabled = false;
    }
});
</script>

</body>
</html>
