
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f7fb;
    padding:20px;
}
.card{
    width:100%;
    max-width:400px;
    background:white;
    padding:40px 30px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}
h2{text-align:center;margin-bottom:10px;color:#1e3a8a;}
p{text-align:center;margin-bottom:20px;color:#555;}
input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:15px;
}
.password-wrapper{
    position:relative;
}
.toggle{
    position:absolute;
    right:12px;
    top:12px;
    cursor:pointer;
}
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:600;
}
button:hover{opacity:0.9;}
.error{
    color:red;
    margin-bottom:10px;
    font-size:14px;
}
.success{
    color:green;
    margin-bottom:10px;
    font-size:14px;
}
@media(max-width:480px){
    .card{padding:30px 20px;}
}
</style>
</head>
<body>

<div class="card">
    <h2>Set New Password</h2>
    <p>Enter your new password below</p>

    <form id="setPasswordForm">
        <input type="email" id="emailField" placeholder="Email" required readonly>

        <div class="password-wrapper">
            <input type="password" id="newPass" placeholder="New Password" required>
            <span class="toggle" onclick="togglePass('newPass')">👁</span>
        </div>

        <div class="password-wrapper">
            <input type="password" id="confirmPass" placeholder="Confirm Password" required>
            <span class="toggle" onclick="togglePass('confirmPass')">👁</span>
        </div>

        <div id="errorMessage" class="error"></div>
        <div id="successMessage" class="success"></div>

        <button type="submit" id="submitBtn">Reset Password</button>
    </form>
</div>

<script>
function togglePass(id){
    const field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}

// Get email from URL
const urlParams = new URLSearchParams(window.location.search);
const email = urlParams.get("email");

if (email) {
    document.getElementById("emailField").value = email;
}

document.getElementById("setPasswordForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const password = document.getElementById("newPass").value;
    const confirmPassword = document.getElementById("confirmPass").value;
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");
    const btn = document.getElementById("submitBtn");

    errorMessage.textContent = "";
    successMessage.textContent = "";

    if (!email) {
        errorMessage.textContent = "Invalid reset session. Please restart password reset.";
        return;
    }

    if (password !== confirmPassword) {
        errorMessage.textContent = "Passwords do not match.";
        return;
    }

    if (password.length < 8) {
        errorMessage.textContent = "Password must be at least 8 characters.";
        return;
    }

    btn.textContent = "Processing...";
    btn.disabled = true;

    try {
        const response = await fetch("/set-password/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                email: email,
                password: password,
                confirm_password: confirmPassword
            })
        });

        const data = await response.json();

        if (response.ok) {
            successMessage.textContent = "Password reset successful! Redirecting to login...";

            setTimeout(() => {
                window.location.href = "/";
            }, 2000);

        } else {
            errorMessage.textContent = data.detail || data.error || "Something went wrong.";
        }

    } catch (error) {
        errorMessage.textContent = "Server error. Please try again.";
    }

    btn.textContent = "Reset Password";
    btn.disabled = false;
});
</script>

</body>
</html>
